{% extends "base.html" %}
{% block title %}退订 — NJTech News{% endblock %}
{% block content %}

<div class="max-w-md mx-auto mt-12 text-center">
    {% if found %}
    <div class="bg-white border border-gray-200 rounded-lg p-8">
        <h1 class="text-xl font-semibold text-gray-800 mb-2">退订成功</h1>
        <p class="text-sm text-gray-500">您已成功退订，将不再收到公告邮件。</p>
        <a href="/" class="inline-block mt-4 text-indigo-600 hover:text-indigo-800 text-sm">&larr; 返回首页</a>
    </div>
    {% else %}
    <div class="bg-white border border-gray-200 rounded-lg p-8">
        <h1 class="text-xl font-semibold text-gray-800 mb-2">链接无效</h1>
        <p class="text-sm text-gray-500">此退订链接已失效或不存在。</p>
        <a href="/" class="inline-block mt-4 text-indigo-600 hover:text-indigo-800 text-sm">&larr; 返回首页</a>
    </div>
    {% endif %}
</div>

{% endblock %}
