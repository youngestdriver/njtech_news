# 南京工业大学各学院/部门公告数据源配置
# 选择器语法为 CSS selector，用于 BeautifulSoup 解析
#
# 支持的选择器字段:
#   selector_container: 包含公告列表的容器元素
#   selector_title:     公告标题元素 (在 container 内)
#   selector_link:      公告链接元素 (在 container 内)
#   selector_date:      公告日期元素 (在 container 内)
# 每个源取标题/链接/日期按索引一一对应
#
# HTML 结构分类:
#   Type A1 (div.txt):      <div.txt > ul > li > a + span          — 化工等 12 个学院
#   Type A2 (div.list):     <div.list > ul > li > a + span.date    — 能源、经管
#   Type A3 (div.fy-list):  <div.fy-list > UL > li > span + a      — 环境 (日期在前)
#   Type A4 (div.ct):       <div.ct > ul > li > a + span           — 法政、数理
#   Type A5 (ul.list):      <ul.list > li > a > span               — 外国语 (日期在 a 内)
#   Type B  (ul.news_list): <ul.news_list.list2 > li > span + a    — 建筑
#   Type C  (UL.ss):        <UL.ss > li > a + span                 — 体育
#   Type D  (a.right-li):   <div.right-list > a.right-li > div     — 土木 (a 标签作条目)
#   Type E  (table):        <table > tr > td > a.listlinkt + font  — 化分、柔性电子
#   Type F  (ul.my-list):   <ul.my-list > li > a + span.date       — 教务处

## 部门

- name: 教务处
  url: https://jwc.njtech.edu.cn/index/ggtz.htm
  category: 部门
  selector_container: ul.my-list
  selector_item: li
  selector_title: a
  selector_link: a
  selector_date: span.date
  is_active: true

